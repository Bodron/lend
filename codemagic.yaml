workflows:
  ios-app-store:
    name: Lend Everything iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lend.ro
      vars:
        BUNDLE_ID: com.lend.ro
        APP_NAME: Lend Everything
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Clean stale CocoaPods files
        script: |
          rm -rf ios/Pods ios/Podfile.lock
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          APP_BUILD_BASE_URL="${APP_BASE_URL:-$APP_BASE_URL_DEV}"
          if [ -z "$APP_BUILD_BASE_URL" ]; then
            echo "APP_BASE_URL or APP_BASE_URL_DEV must be set in Codemagic environment."
            exit 1
          fi
          flutter build ipa --release --export-options-plist=$CM_EXPORT_OPTIONS_PLIST --dart-define=APP_BASE_URL="$APP_BUILD_BASE_URL"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        expire_build_submitted_for_review: true
        submit_to_app_store: false
